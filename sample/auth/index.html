<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login Page</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>

    :root {
      --bg1: #0f0f14; --bg2: #15151f; --card: #1c1c29; --text: #e8e8ff; --muted: #a9a9c1;
      --accent: #7c4dff; --accent-2: #00ffc6; --chip: #2b2b3b;
    }
    body {
      background: radial-gradient(1200px 600px at 15% 0%, #18182a 0%, var(--bg1) 60%) fixed,
                  linear-gradient(180deg, var(--bg1), var(--bg2)) fixed;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      padding: 20px;
      align-items: center;
      justify-content: center;
    }

    .login-card{
      background: var(--card);
      border: 1px solid rgba(124, 77, 255, 0.25);
      border-radius: 18px;
      padding: 2.2rem 2rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
    }
    
    .brand{
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 1.5rem;
    }

    .brand span{
      font-weight: 800;
      font-size: 1.8rem;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: 0.5px;
    }

    .form-label{ color: var(--muted);}
    .form-control{
      background: #12121b;
      border: 1px solid rgba(124, 77, 255, 0.35);
      color: var(--text);
      border-radius: 10px;
    }
    .form-control:focus{
      border-color: var(--accent);
      box-shadow: 0 0 0 .2rem rgba(124, 77, 255, 0.25);;
      background-color: #151525;
      color: var(--text);
    }

    .btn-login{
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      border:none;
      color: #0e0e14;
      font-weight: 700;
      padding: 10px 0;
      transition: opacity 0.2s;
      border-radius: 10px;
    }
    .btn-login:hover{ opacity: .9;}

    a{color: var(--accent-2); text-decoration: none;}
    a:hover{text-decoration: underline;}
    
    #responseBox{
      border-radius: 10px;
      border: 1px solid rgba(124, 77, 255, 0.35);
      background: #141420;
      color: var(--text);
    }
    
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--accent-2);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      user-select: none;
    }

    .back-link:hover {
      color: var(--accent);
      text-shadow: 0 0 8px rgba(124, 77, 255, 0.6);
      transform: translateY(-1px);
    }

  </style>
</head>
<body>

<div class="login-card">
  <div class="brand">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
      <path d="M4 12l4-8 4 8-4 8-4-8Zm8 0 4-8 4 8-4 8-4-8Z" stroke="url(#g)" stroke-width="1.5"/>
      <defs><linearGradient id="g" x1="0" y1="0" x2="24" y2="24">
        <stop stop-color="#7c4dff"/><stop offset="1" stop-color="#00ffc6"/>
      </linearGradient></defs>
    </svg>
    <span>GameHub</span>
  </div>
  <div id="loginSection">
    <h4 class="text-center mb-4 fw-semibold">Welcome Back</h4>

    <form id="loginForm">
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input type="text" class="form-control" id="username" required>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" required>
      </div>

      <button type="submit" class="btn btn-login w-100">Login</button>
    </form>
  </div>


  <div id="mfaSection" class="d-none">
    <h4 class="text-center mb-2 fw-semibold">Enter Verification Code</h4>

    <form id="mfaForm">
      <div class="mb-3">
        <label for="mfaCode" class="form-label text-center d-block">Verification Code</label>
        <input type="text" class="form-control mfa-code-input" id="mfaCode" 
               maxlength="4" pattern="[0-9]{4}" 
               placeholder="####" required autocomplete="off">
      </div>

      <button type="submit" class="btn btn-login w-100">Verify Code</button>
    </form>

    <div class="text-center mt-3">
      <span class="back-link" id="backToLogin">
        <i class="bi bi-arrow-left"></i>Back to Login 
      </span>
    </div>
  </div>

  <div id="responseBox" class="alert mt-3 d-none"></div>

  <!-- Link to registration -->
  <div class="text-center mt-2">
    <a href="register.html">Don’t have an account? Create one</a>
  </div>
  
</div>

<script>
let currentUname = '';

document.getElementById("loginForm").addEventListener("submit", function(e) {
  e.preventDefault();

  let username = document.getElementById("username").value;
  let password = document.getElementById("password").value;
  currentUname = username;

  let xhr = new XMLHttpRequest();
  xhr.open("POST", "login.php", true);
  xhr.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");

  xhr.onreadystatechange = function() {
    if (this.readyState === 4 && this.status === 200) {
      try {
        let res = JSON.parse(this.responseText);
        let box = document.getElementById("responseBox");
        box.classList.remove("d-none", "alert-success", "alert-danger");

        if (res.success) {
          document.getElementById("loginSection").classList.add("d-none");
          document.getElementById("mfaSection").classList.remove("d-none");
          document.getElementById("responseBox").classList.add("d-none");
          document.getElementById("mfaCode").focus();
          console.log("MFA now required");

        } else {
          box.classList.add("alert-danger");
          box.innerHTML = res.message;
          console.log("❌ Database rejected login:", res.message);
        }
      } catch (err) {
        alert("Invalid server response loginForm: " + err);
        console.error("Parse error:", err, "Raw response:", this.responseText);
      }
    }
  };

  xhr.send("uname=" + encodeURIComponent(username) + "&pword=" + encodeURIComponent(password));
});

document.getElementById("mfaForm").addEventListener("submit", function(e) {
  e.preventDefault();

  let code = document.getElementById("mfaCode").value;

  let xhr = new XMLHttpRequest();
  xhr.open("POST", "mfa_check.php", true);
  xhr.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");

  xhr.onreadystatechange = function() {
    if (this.readyState === 4 && this.status === 200) {
      try {
        let res = JSON.parse(this.responseText);
        let box = document.getElementById("responseBox");
        box.classList.remove("d-none", "alert-success", "alert-danger");

        if (res.success) {
          box.classList.add("alert-success");
          box.innerHTML = res.message;
          console.log("MFA successful:", res.username);
          const u = res.username || username;
          window.location.replace("/home.php");
          
        } else {
          box.classList.add("alert-danger");
          box.innerHTML = res.message;
          console.log("MFA failed:", res.message);
          document.getElementById("mfaCode").value = '';
          document.getElementById("mfaCode").focus();
        }
      } catch (err) {
        alert("Invalid server response: " + this.responseText);
        console.error("Parse error:", err, "Raw response:", this.responseText);
      }
    }
  };

  xhr.send("uname=" + encodeURIComponent(currentUname) + "&code=" + encodeURIComponent(code));
});

//Link to go Back to Login
document.getElementById("backToLogin").addEventListener("click", function() {
  document.getElementById("mfaSection").classList.add("d-none");
  document.getElementById("loginSection").classList.remove("d-none");
  document.getElementById("responseBox").classList.add("d-none");
  document.getElementById("mfaCode").value = '';
  document.getElementById("password").value = '';
});

//make it digits only
document.getElementById("mfaCode").addEventListener("input", function(e) {
  this.value = this.value.replace(/[^0-9]/g, '');
});
</script>

</body>
</html>
